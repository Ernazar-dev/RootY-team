# Render Blueprint: https://render.com/docs/blueprint-spec
# The PostgreSQL database lives on Neon; paste its connection string into
# DATABASE_URL in the Render dashboard (never commit it).
services:
  - type: web
    name: rooty-team
    runtime: node
    plan: free
    # Same region as the Neon project (AWS eu-central-1, Frankfurt): every
    # page queries the database, so the two must sit close together.
    region: frankfurt
    # Migrations run before the build: lesson pages are prerendered and read
    # the lesson_edits table, so it must exist first.
    buildCommand: npm ci && npm run db:migrate && npm run build
    startCommand: npm start
    healthCheckPath: /uz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SITE_URL
        sync: false
      # Neon: the pooled string (host has "-pooler") for the app...
      - key: DATABASE_URL
        sync: false
      # ...and the direct one for migrations at build time.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # The admin account, created or updated on every start.
      - key: ADMIN_LOGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
